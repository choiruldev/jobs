name: Update Job Listings

on:
  schedule:
    # Berjalan setiap 6 jam
    - cron: '0 */6 * * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions GitHub

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy pandas requests || true

      - name: Run Job Ingestion
        run: |
          python scripts/fetch_jobs.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/jobs.json
          if git diff --staged --quiet; then
            echo "No changes in jobs data."
          else
            git commit -m "chore(data): auto-update job listings [skip ci]"
            git push
          fi
