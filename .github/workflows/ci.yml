name: CI Quality & Test Matrix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} - Build, Health & 5 Test Suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci || npm install --package-lock-only

      - name: Start Test Server on Port 8080
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Run Production Build Script
        run: npm run build

      - name: Run All 5 Integrity & Performance Test Suites
        run: npm test
